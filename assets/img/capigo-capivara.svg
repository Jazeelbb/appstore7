<svg width="285" height="266" viewBox="0 0 285 266" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  #Earned_duvida {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: breathe 5.5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%   { transform: translateY(0)      scaleY(1);     }
    30%  { transform: translateY(-2.5px) scaleY(1.014); }
    60%  { transform: translateY(-1px)   scaleY(1.004); }
    100% { transform: translateY(0)      scaleY(1);     }
  }

  /* olhos piscam */
  .eyewrap {
    transform-box: fill-box; transform-origin: center;
    animation: blink 6s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1);   }
    94%           { transform: scaleY(0.08);}
    96%           { transform: scaleY(1);   }
  }

  /* brilho (glint) na pupila: pulsa */
  .glint {
    transform-box: fill-box; transform-origin: center;
    animation: glint 2.2s ease-in-out infinite;
  }
  #glintR { animation-delay: 0.3s; }
  @keyframes glint {
    0%, 100% { transform: scale(0.8); opacity: 0.7; }
    50%      { transform: scale(1.2); opacity: 1;   }
  }

  /* estrelinhas cintilando ao redor dos olhos */
  .star {
    transform-box: fill-box; transform-origin: center;
    animation: twinkle 1.9s ease-in-out infinite;
  }
  #starR { animation-delay: 0.6s; }
  @keyframes twinkle {
    0%, 100% { transform: scale(0);   opacity: 0; }
    45%      { transform: scale(1.25) rotate(35deg); opacity: 1; }
    60%      { transform: scale(1)    rotate(45deg); opacity: 1; }
    80%      { transform: scale(0);   opacity: 0; }
  }
</style>
